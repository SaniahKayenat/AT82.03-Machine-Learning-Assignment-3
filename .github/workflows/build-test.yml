# CI/CD for A3 Objective 3.
#
#   push to main  ->  run the unit tests  ->  if they pass, build and push the image
#                 ->  then SSH to ml-brain and restart the container with the new image
#
# A push to any other branch, or a pull request, runs the tests only. That way a broken
# commit can never reach the server: the deploy job `needs: build-test`, so GitHub skips it
# whenever the test job fails.
name: Build-Test-Deploy
run-name: ${{ github.actor }} building, testing and deploying

on:
  push:
    branches:
      - "**" # every branch: "once you push a commit, it will evoke the testing script"
  pull_request:
  workflow_dispatch: # lets me trigger a run by hand from the Actions tab

jobs:
  # ---------------------------------------------------------------- test + build
  build-test:
    runs-on: ubuntu-latest
    steps:
      # clone the repo into the runner
      - uses: actions/checkout@v4

      # The app reads the MLflow address from the environment rather than from the code,
      # so the server URL is not baked into the public image. `fail_on_empty: false`
      # because MLFLOW_TRACKING_URI is allowed to be empty: with no server configured the
      # app and the tests fall back to the model copy inside the image, which is what keeps
      # CI green while the class MLflow server is down.
      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          envkey_APP_MODEL_NAME: ${{ secrets.APP_MODEL_NAME }}
          envkey_APP_MODEL_STAGE: Staging
          file_name: .env
          fail_on_empty: false
          sort_keys: true

      - name: Build the Docker image
        run: docker compose -f app/docker-compose.yaml build

      - name: Start the container
        run: docker compose -f app/docker-compose.yaml up -d

      # the testing script. -T because the runner has no TTY.
      - name: Run the unit tests
        run: docker compose -f app/docker-compose.yaml exec -T dash pytest test_model.py -v

      - name: Stop the container
        if: always()
        run: docker compose -f app/docker-compose.yaml down

      # --- everything below only runs on main, and only if the tests above passed ---
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: . # repo root: the image needs logistic_regression.py
          file: app/.Dockerfile
          push: true
          # `latest` is what the server pulls; the sha tag makes each build identifiable
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-predictor:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-predictor:${{ github.sha }}

  # ---------------------------------------------------------------- deploy
  deploy:
    # `needs` is what makes this "deploy only if the tests passed": if build-test fails,
    # GitHub never starts this job.
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ml-brain over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }} # key still authenticates to ml-brain
          proxy_host: ${{ vars.PROXY_HOST }}
          proxy_username: ${{ secrets.USERNAME }}
          proxy_password: ${{ secrets.PROXY_PASSWORD }} # bazooka wants a password, not a key
          script: |
            cd ~/st126956
            docker compose pull
            docker compose up -d
            docker compose ps
